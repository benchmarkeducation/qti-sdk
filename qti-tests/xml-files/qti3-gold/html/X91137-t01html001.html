  <h1>A Long Drought 
</h1>
 <p><img  alt="A map of the United States, with parts of Canada and Mexico. A yellow area shows where a drought occurred. A dark circle shows the Dust Bowl region." src="../media/X91137-passage001-img001.jpg" /></p>
 <ol>
  <li>In the 1930s, much of the United States went through an extreme drought. The Great Plains region, between the Mississippi River and the Rocky Mountains, was hit the hardest. Weeks of dry weather stretched into month after month with scarcely any rain. The drought was especially bad from 1934 to 1936. 
</li>
  <li>The drought came at a terrible time. The United States was already suffering through the Great Depression, which began in 1929. All across the country, many people were out of work. Many families had lost their homes. Almost everyone was struggling to survive. 
</li>
  <li>During the Great Depression, most people in the Great Plains farmed for a living. To make more money, farmers planted more crops. This practice was hard on the land because it wore out the soil and led to soil erosion. When the drought struck, the soil dried out and turned into dust. Winds easily stirred up the dust and carried it into the air. A haze of dust often hung in the sky for days after the winds died down. 
</li>
  <li>As the terrible drought wore on, these dust storms happened more frequently throughout the Great Plains. The worst dust storms struck parts of five states in an area that became known as the Dust Bowl. Storms in the Dust Bowl did tremendous damage. Dust piled against houses, barns, and schools. It covered roads and railroad tracks, yards and porches. It clogged car motors and seeped into houses under closed doors. It made the air unhealthy to breathe. 
</li>
  <li>The Dust Bowl's most destructive dust storm struck on Sunday, April 14, 1935. The "Black Sunday" storm was brought on by powerful, cold winds that picked up dust as they raced across the Great Plains. As the storm approached, it looked like a dark, towering wall. It hit northern Oklahoma first and then roared south into Texas. It turned the afternoon sky as black as night. 
</li>
  <li>During the years of drought, many farmers in the Dust Bowl felt hopeless. Eventually, they migrated west. Many tried to find farm work in California. They moved there in the hopes of a better life. For those who remained, help came slowly. The government set up programs to help farmers and taught them better ways to plant their crops. The farmers learned how to take care of the soil and make it productive again. They planted trees to keep the soil from blowing away. 
</li>
  <li>In the fall of 1939, the drought finally ended. A sense of hope returned to the Great Plains. With the lessons the farmers had learned, they once again began to produce large harvests. 
</li>
 </ol>
