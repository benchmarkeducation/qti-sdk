  <h1>Lost in the Dust 
</h1>
 <ol>
  <li>When I was four years old, I got lost for a moment in Daddy's wheat field. Mama had taken me outside while she hung sheets on the line to dry. As soon as she hung up the first one, I went running into the wheat. It was taller than I was. Once I got into it, I couldn't find my way out. Daddy located me deep in the field by following my calls. 
</li>
  <li>By the time I was ten, there was no wheat at all. Years of droughts and dust storms had destroyed our fields. The soil dried up and blew away, and nothing was left but hard, parched ground. Not even weeds could grow in it. 
</li>
  <li>The ruined fields were awful to see, but the dust storms were downright terrifying. We could spot them darkening the skies from miles away. If a storm approached while I was at school, Mama would rush over in the car to drive me home while Daddy scrambled to get the cows into the barn. One storm moved in so fast that Daddy waited it out with the cows in the barn because he couldn't see the house. After that, he set up a guide rope to find his way during the storm. 
</li>
  <li>I came to hate the wind. It didn't carry rain clouds our way. Instead it just scooped up the dust piles and threw them somewhere else. Even on calm days, the dust hung in the air. We smelled it, tasted it, and felt its grittiness on our skin. Mama had to abandon her backyard clothesline and set one up in the cellar, but somehow the dust drifted down there, too. 
</li>
  <li>After three years of droughts, Mama urged Daddy to leave the farm and move to California. But Daddy disagreed. He was unwilling to give up on his wheat fields. He did not believe our terrible luck could last much longer. As it turned out, the droughts dragged on five more years. But somehow, we managed to survive. 
</li>
 </ol>
